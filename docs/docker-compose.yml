version: '3.8'

services:
  nova-postgres:
    image: postgres:16-alpine
    container_name: nova_postgres
    environment:
      POSTGRES_DB: nova_db
      POSTGRES_USER: nova_admin
      POSTGRES_PASSWORD: nova_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_admin -d nova_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nova-redis:
    image: redis:7-alpine
    container_name: nova_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  nova-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: nova_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  nova-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nova_backend_service
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://nova-postgres:5432/nova_db
      POSTGRES_USER: nova_admin
      POSTGRES_PASSWORD: nova_secure_password_2026
      REDIS_HOST: nova-redis
      REDIS_PORT: 6379
      MINIO_URL: http://nova-minio:9000
    depends_on:
      nova-postgres:
        condition: service_healthy
      nova-redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
