name: NOVA CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Code Style & Lint Check
        run: ./gradlew lint --continue --warning-mode=all

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --warning-mode=all

      - name: Build Universal Debug APK
        run: ./gradlew assembleDebug --warning-mode=all

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease --warning-mode=all

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-universal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
