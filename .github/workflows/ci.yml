name: NOVA CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Ensure Google Services Configuration
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"nova-app","storage_bucket":"nova-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"com.example.nova"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyMockKeyForBuildVerification123"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

      - name: Run Code Style & Lint Check
        run: ./gradlew lint -Dlint.abortOnError=false --continue --warning-mode=all || true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --warning-mode=all

      - name: Build Universal Debug APK
        run: ./gradlew assembleDebug --warning-mode=all

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease --warning-mode=all

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-universal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
